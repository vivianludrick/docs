name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      docs_dir:
        description: "Folder containing the markdown files"
        required: false
        default: "docs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: 12.11.2
          runtime: node@24
          install: false
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Resolve site URL and base path
        id: pages
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "site=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${REPO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm build
        env:
          SITE: ${{ steps.pages.outputs.site }}
          BASE_PATH: ${{ steps.pages.outputs.base }}
          DOCS_DIR: ./${{ github.event.inputs.docs_dir || 'docs' }}
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
